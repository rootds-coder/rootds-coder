<svg xmlns="http://www.w3.org/2000/svg" width="440" height="244" viewBox="0 0 440 244" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace">
<title>Devil AI</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b1d"/><stop offset="1" stop-color="#0f1736"/></linearGradient>
<linearGradient id="bd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
<linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".09"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<radialGradient id="gl"><stop offset="0" stop-color="#a78bfa" stop-opacity=".45"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
<clipPath id="c"><rect x="2" y="2" width="436" height="240" rx="16"/></clipPath>
</defs>
<style>
.fl{animation:fl 3s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.fw{stroke-dasharray:180 1100;animation:fw 4s linear infinite}
@keyframes fw{to{stroke-dashoffset:-1280}}
.sh{animation:sh 4.5s ease-in-out infinite}
@keyframes sh{0%{transform:translateX(-160px) skewX(-20deg)}60%,100%{transform:translateX(520px) skewX(-20deg)}}
.pu{animation:pu 3s ease-in-out infinite}
@keyframes pu{0%,100%{opacity:.5}50%{opacity:1}}
.ch{opacity:0;animation:ch .5s ease forwards}
@keyframes ch{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.ar{animation:ar 1.4s ease-in-out infinite}
@keyframes ar{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}
</style>
<rect x="2" y="2" width="436" height="240" rx="16" fill="url(#bg)"/>
<g clip-path="url(#c)"><circle class="pu" cx="380" cy="50" r="90" fill="url(#gl)"/><rect class="sh" x="0" y="0" width="70" height="244" fill="url(#sh)"/></g>
<rect x="2" y="2" width="436" height="240" rx="16" fill="none" stroke="#a78bfa" stroke-opacity=".3" stroke-width="1.5"/>
<rect class="fw" x="2" y="2" width="436" height="240" rx="16" fill="none" stroke="url(#bd)" stroke-width="3" stroke-linecap="round"/>
<g class="fl"><text x="26" y="66" font-size="38">😈</text></g>
<text x="84" y="52" fill="#ffffff" font-size="24" font-weight="800">Devil AI</text>
<text x="84" y="76" fill="#a78bfa" font-size="11.5" font-weight="700" letter-spacing="1.4">MULTI-PERSONA AI · WHATSAPP</text>
<text x="26" y="118" fill="#a9b8d0" font-size="12.5">Customizable AI personas, messaging workflows,</text>
<text x="26" y="139" fill="#a9b8d0" font-size="12.5">per-user session isolation, provider routing.</text>
<g class="ch" style="animation-delay:0.2s"><rect x="26" y="160" width="71" height="26" rx="13" fill="#a78bfa" fill-opacity=".12" stroke="#a78bfa" stroke-opacity=".55"/><text x="61.5" y="177" fill="#e8fbff" font-size="12" text-anchor="middle">Node.js</text></g><g class="ch" style="animation-delay:0.38s"><rect x="105" y="160" width="71" height="26" rx="13" fill="#a78bfa" fill-opacity=".12" stroke="#a78bfa" stroke-opacity=".55"/><text x="140.5" y="177" fill="#e8fbff" font-size="12" text-anchor="middle">Express</text></g><g class="ch" style="animation-delay:0.56s"><rect x="184" y="160" width="71" height="26" rx="13" fill="#a78bfa" fill-opacity=".12" stroke="#a78bfa" stroke-opacity=".55"/><text x="219.5" y="177" fill="#e8fbff" font-size="12" text-anchor="middle">Baileys</text></g><g class="ch" style="animation-delay:0.74s"><rect x="263" y="160" width="71" height="26" rx="13" fill="#a78bfa" fill-opacity=".12" stroke="#a78bfa" stroke-opacity=".55"/><text x="298.5" y="177" fill="#e8fbff" font-size="12" text-anchor="middle">MongoDB</text></g><g class="ch" style="animation-delay:0.9199999999999999s"><rect x="342" y="160" width="71" height="26" rx="13" fill="#a78bfa" fill-opacity=".12" stroke="#a78bfa" stroke-opacity=".55"/><text x="377.5" y="177" fill="#e8fbff" font-size="12" text-anchor="middle">AI APIs</text></g>
<line x1="26" y1="204" x2="414" y2="204" stroke="#a78bfa" stroke-opacity=".2"/>
<text x="26" y="227" fill="#a78bfa" font-size="12" font-weight="700" letter-spacing="1.5">OPEN SOURCE</text>
<text class="ar" x="132" y="227" fill="#f472b6" font-size="14" font-weight="700">→</text>
</svg>