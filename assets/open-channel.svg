<line x1="24" y1="50" x2="876" y2="50" stroke="#22d3ee" stroke-opacity=".2"/>
<g clip-path="url(#tc0)"><text x="40" y="92" fill="#22d3ee" font-size="15">root@dhruv:~$ ./open_channel --collab</text></g>
