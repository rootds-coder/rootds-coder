<svg xmlns="http://www.w3.org/2000/svg" width="900" height="64" viewBox="0 0 900 64" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace">
<title>Section 04: TECH ARSENAL</title>
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox" spreadMethod="reflect">
<stop offset="0" stop-color="#34d399"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#34d399"/>
<animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="3.5s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient>
</defs>
<style>
.tag{animation:tg 2.4s ease-in-out infinite}
@keyframes tg{0%,100%{opacity:.55}50%{opacity:1}}
.dr{stroke-dasharray:900;stroke-dashoffset:900;animation:dr 4s ease-in-out infinite}
@keyframes dr{0%{stroke-dashoffset:900}45%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-900}}
.sl{animation:sl .8s ease-out both}
@keyframes sl{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:translateX(0)}}
</style>
<g class="sl">
<rect x="4" y="12" width="64" height="30" rx="8" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".6"/>
<text class="tag" x="36" y="33" fill="#34d399" font-size="15" font-weight="700" text-anchor="middle">[ 04 ]</text>
<text x="86" y="34" fill="url(#g)" font-size="22" font-weight="800" letter-spacing="2">TECH ARSENAL</text>
</g>
<path class="dr" d="M4 54 H896" stroke="url(#ln)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
</svg>