<text x="48" y="292" fill="#22d3ee" font-size="13" font-weight="700" letter-spacing="1.5">CURRENTLY BUILDING</text><text x="48" y="320" fill="#c9d6e8" font-size="13"><tspan fill="#22d3ee">›</tspan> AI assistants</text><text x="48" y="341" fill="#c9d6e8" font-size="13"><tspan fill="#22d3ee">›</tspan> API orchestration</text><text x="48" y="362" fill="#c9d6e8" font-size="13"><tspan fill="#22d3ee">›</tspan> Automation tools &amp; web products</text></g>
<g class="pt" style="animation-delay:2.5s">
<rect x="315" y="262" width="270" height="124" rx="12" fill="#0a1128" stroke="#a78bfa" stroke-opacity=".45"/>
<rect class="glow" x="315" y="262" width="270" height="4" rx="2" fill="#a78bfa"/>
<text x="333" y="292" fill="#a78bfa" font-size="13" font-weight="700" letter-spacing="1.5">DAILY DRIVERS</text><text x="333" y="320" fill="#c9d6e8" font-size="13"><tspan fill="#a78bfa">›</tspan> JavaScript / TypeScript</text><text x="333" y="341" fill="#c9d6e8" font-size="13"><tspan fill="#a78bfa">›</tspan> Node.js · React · Python</text><text x="333" y="362" fill="#c9d6e8" font-size="13"><tspan fill="#a78bfa">›</tspan> Databases &amp; cloud deploys</text></g>
<g class="pt" style="animation-delay:2.8000000000000003s">
<rect x="600" y="262" width="270" height="124" rx="12" fill="#0a1128" stroke="#34d399" stroke-opacity=".45"/>
<rect class="glow" x="600" y="262" width="270" height="4" rx="2" fill="#34d399"/>
<text x="618" y="292" fill="#34d399" font-size="13" font-weight="700" letter-spacing="1.5">EXPLORING</text><text x="618" y="320" fill="#c9d6e8" font-size="13"><tspan fill="#34d399">›</tspan> System design &amp; reliability</text><text x="618" y="341" fill="#c9d6e8" font-size="13"><tspan fill="#34d399">›</tspan> Developer experience</text><text x="618" y="362" fill="#c9d6e8" font-size="13"><tspan fill="#34d399">›</tspan> Privacy-aware software, OSS</text></g>
