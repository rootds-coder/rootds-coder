<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace">
<title>Operator profile</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050816"/><stop offset="1" stop-color="#0d1330"/></linearGradient>
<linearGradient id="bd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
<linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset=".5" stop-color="#22d3ee" stop-opacity=".22"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient>
<pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#1e2a4a" stroke-width=".6" opacity=".55"/></pattern>
<clipPath id="card"><rect x="2" y="2" width="896" height="406" rx="18"/></clipPath>
</defs>
<style>
.k{fill:#22d3ee;font-size:15px;font-weight:700;letter-spacing:1px}
.v{fill:#e8fbff;font-size:15px}
.row{opacity:0;animation:in .6s ease forwards}
@keyframes in{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:translateX(0)}}
.pt{opacity:0;animation:up .7s ease forwards}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.dot{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.cur{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.sweep{animation:sweep 5s linear infinite}
@keyframes sweep{from{transform:translateY(-60px)}to{transform:translateY(410px)}}
.flow{stroke-dasharray:260 2400;animation:flow 6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-2660}}
.glow{animation:glow 3s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:1}}
</style>
<rect x="2" y="2" width="896" height="406" rx="18" fill="url(#bg)"/>
<rect x="2" y="2" width="896" height="406" rx="18" fill="url(#grid)"/>
<g clip-path="url(#card)"><rect class="sweep" x="0" y="0" width="900" height="60" fill="url(#scan)"/></g>
<rect x="2" y="2" width="896" height="406" rx="18" fill="none" stroke="#22d3ee" stroke-opacity=".25" stroke-width="1.5"/>
<rect class="flow" x="2" y="2" width="896" height="406" rx="18" fill="none" stroke="url(#bd)" stroke-width="3" stroke-linecap="round"/>
<circle cx="32" cy="30" r="6" fill="#f87171"/><circle cx="52" cy="30" r="6" fill="#fbbf24"/><circle cx="72" cy="30" r="6" fill="#34d399"/>
<text x="100" y="35" fill="#7c8db5" font-size="13">operator@rootds:~$ cat profile.sys</text>
<line x1="24" y1="50" x2="876" y2="50" stroke="#22d3ee" stroke-opacity=".2"/>
