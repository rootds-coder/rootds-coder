<text x="379" y="322" fill="#34d399" font-size="16" font-weight="800" letter-spacing="3">DEBUG</text>
<text x="345" y="354" fill="#c9d6e8" font-size="12.5">Read logs, isolate failures,</text>
<text x="345" y="374" fill="#c9d6e8" font-size="12.5">test fixes, cut regressions</text>
<rect class="bar" x="345" y="392" width="220" height="3" rx="2" fill="#34d399" style="transform-box:fill-box;transform-origin:left;animation-delay:2.67s"/>
</g>
