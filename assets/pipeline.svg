<text class="title" x="450.0" y="23" fill="#9fb4d8" font-size="12" text-anchor="middle" letter-spacing="5">SCENE 03  ·  THE BUILD LOOP</text>
<text x="450.0" y="457" fill="#5e6f94" font-size="11" text-anchor="middle" letter-spacing="3">IDEA → PROTOTYPE → ARCHITECTURE → IMPLEMENTATION → VALIDATION → RELEASE → FEEDBACK → ∞</text>
<rect width="900" height="470" fill="url(#vg)"/>
</g>
<rect x="2" y="2" width="896" height="466" rx="18" fill="none" stroke="url(#bd)" stroke-opacity=".5" stroke-width="1.5"/>
<line class="flowl" x1="75" y1="170" x2="825" y2="170" stroke="#2c3b66" stroke-width="3"/>
<path class="flowl" d="M825 132 C 825 62, 75 62, 75 132" fill="none" stroke="#2c3b66" stroke-width="2"/>
<text x="450.0" y="86" fill="#7c8db5" font-size="11" text-anchor="middle" letter-spacing="3">NEXT ITERATION</text>
<g>
<circle class="lit" style="animation-delay:0s" cx="75" cy="170" r="34" fill="#22d3ee" stroke="#22d3ee" stroke-width="2.5"/>
