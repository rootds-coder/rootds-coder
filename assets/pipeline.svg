<text x="664" y="322" fill="#f472b6" font-size="16" font-weight="800" letter-spacing="3">SHIP</text>
<text x="630" y="354" fill="#c9d6e8" font-size="12.5">Deploy, document,</text>
<text x="630" y="374" fill="#c9d6e8" font-size="12.5">listen, improve</text>
<rect class="bar" x="630" y="392" width="220" height="3" rx="2" fill="#f472b6" style="transform-box:fill-box;transform-origin:left;animation-delay:5.33s"/>
