<g>
<circle class="lit" style="animation-delay:6s" cx="825" cy="170" r="34" fill="#22d3ee" stroke="#22d3ee" stroke-width="2.5"/>
<text class="ic" style="animation-delay:6s" x="825" y="180" font-size="28" text-anchor="middle">📣</text>
<text class="lab" style="animation-delay:6s" x="825" y="232" fill="#22d3ee" font-size="11.5" font-weight="700" text-anchor="middle" letter-spacing="1.2">FEEDBACK</text>
</g>

<g>
