<text class="lab" style="animation-delay:2s" x="325" y="232" fill="#22d3ee" font-size="11.5" font-weight="700" text-anchor="middle" letter-spacing="1.2">ARCHITECT</text>
</g>
<g>
<circle class="lit" style="animation-delay:3s" cx="450" cy="170" r="34" fill="#a78bfa" stroke="#a78bfa" stroke-width="2.5"/>
