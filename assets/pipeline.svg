<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace">
<title>How a typical system gets built: idea, prototype, architecture, implementation, validation, release, feedback, then iterate</title>
